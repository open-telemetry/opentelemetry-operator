change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. collector, target allocator, auto-instrumentation, opamp, github action)
component: target allocator

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add periodic re-check for Prometheus CRDs absent at startup

# One or more tracking issues related to the change
issues: [5577]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The Target Allocator previously checked Prometheus CRD availability (ServiceMonitor, PodMonitor,
  Probe, ScrapeConfig) once at startup. Missing CRDs caused the TA to silently ignore all CRs of
  those types forever, requiring a pod restart to recover.

  Two new fields under `prometheusCR` enable opt-in periodic retry:

  - `retryMissingCRDs` (bool, default false): when true, the TA re-checks absent CRDs every
    5 minutes and starts their informers as soon as the CRDs appear.
  - `waitForCRDs` ([]string, default []): scopes which absent CRDs are retried. Empty means all
    absent CRDs. Valid values: servicemonitors, podmonitors, probes, scrapeconfigs.
