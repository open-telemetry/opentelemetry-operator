name: "Check Auto-Instrumentation Revision"

on:
  pull_request:
    paths:
      - "autoinstrumentation/**"
      - ".github/workflows/check-autoinstrumentation-revision.yaml"
      - "hack/autoinstrumentation-revision/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.26.7"

      - name: Validate autoinstrumentation revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-autoinstrumentation-revision
