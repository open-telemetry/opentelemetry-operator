name: Reusable - Publish autoinstrumentation E2E images

on:
  workflow_call:
    inputs:
      path:
        type: string
        required: true
      platforms:
        type: string
        required: true
      build-args:
        type: string
        required: false
        default: ''
      tag-suffix:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish-e2e-image:
    permissions:
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/e2e-test-app-${{ inputs.path }}
          tags: |
            type=ref,event=branch,suffix=${{ inputs.tag-suffix }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Package Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          context: tests/test-e2e-apps/${{ inputs.path }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=publish-e2e-${{ inputs.path }}${{ inputs.tag-suffix }}
          cache-to: type=gha,mode=max,scope=publish-e2e-${{ inputs.path }}${{ inputs.tag-suffix }}
