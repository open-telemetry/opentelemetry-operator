collector_namespace: default
collector_selector:
  matchlabels:
    app.kubernetes.io/instance: default.test
    app.kubernetes.io/managed-by: opentelemetry-operator
prometheus_cr:
  enabled: true
  scrape_interval: 60s
collector_not_ready_grace_period: 30s
https:
  enabled: true
  listen_addr: :8443
  ca_file_path: /path/to/ca.pem
  tls_cert_file_path: /path/to/cert.pem
  tls_key_file_path: /path/to/key.pem
  min_version: VersionTLS12
  cipher_suites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  curve_preferences:
    - 29
    - 23
config:
  scrape_configs:
  - job_name: prometheus

    file_sd_configs:
    - files:
      - ./file_sd_test.json

    static_configs:
    - targets: ["prom.domain:9001", "prom.domain:9002", "prom.domain:9003"]
      labels:
        my: label
