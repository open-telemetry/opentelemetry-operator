apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-opamp-bridge
    app.kubernetes.io/instance: test.test
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: test-opamp-bridge
    app.kubernetes.io/part-of: opentelemetry
    app.kubernetes.io/version: latest
  name: test-opamp-bridge
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-opamp-bridge
      app.kubernetes.io/instance: test.test
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
  strategy: {}
  template:
    metadata:
      annotations:
        opentelemetry-opampbridge-config/hash: 8f6dd3e9c9172f69d5d4862699d8324d6e62c27cea34f51a556c91514efd823e
      labels:
        app.kubernetes.io/component: opentelemetry-opamp-bridge
        app.kubernetes.io/instance: test.test
        app.kubernetes.io/managed-by: opentelemetry-operator
        app.kubernetes.io/name: test-opamp-bridge
        app.kubernetes.io/part-of: opentelemetry
        app.kubernetes.io/version: latest
    spec:
      containers:
      - env:
        - name: OTELCOL_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: opamp-bridge-container
              divisor: "0"
              resource: limits.memory
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: opamp-bridge-container
              divisor: "0"
              resource: limits.cpu
        - name: OPAMP_BRIDGE_RESOURCE_UID
          value: 0cf40c70-7602-4412-81d5-f61b8ddb4a41
        image: test
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: opamp-bridge-container
        ports:
        - containerPort: 8080
          name: opamp
          protocol: TCP
        - containerPort: 8081
          name: healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: healthz
        resources: {}
        volumeMounts:
        - mountPath: /conf
          name: opamp-bridge-internal
      dnsConfig: {}
      dnsPolicy: ClusterFirst
      serviceAccountName: test-opamp-bridge
      volumes:
      - configMap:
          items:
          - key: remoteconfiguration.yaml
            path: remoteconfiguration.yaml
          name: test-opamp-bridge
        name: opamp-bridge-internal
---
apiVersion: v1
data:
  remoteconfiguration.yaml: |
    capabilities:
      AcceptsOpAMPConnectionSettings: true
      AcceptsOtherConnectionSettings: true
      AcceptsRemoteConfig: true
      AcceptsRestartCommand: true
      ReportsEffectiveConfig: true
      ReportsHealth: true
      ReportsOwnLogs: true
      ReportsOwnMetrics: true
      ReportsOwnTraces: true
      ReportsRemoteConfig: true
      ReportsStatus: true
    componentsAllowed:
      exporters:
      - debug
      processors:
      - memory_limiter
      receivers:
      - otlp
    endpoint: ws://opamp-server:4320/v1/opamp
    name: test
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-opamp-bridge
    app.kubernetes.io/instance: test.test
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: test-opamp-bridge
    app.kubernetes.io/part-of: opentelemetry
    app.kubernetes.io/version: latest
  name: test-opamp-bridge
  namespace: test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-opamp-bridge
    app.kubernetes.io/instance: test.test
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: test-opamp-bridge
    app.kubernetes.io/part-of: opentelemetry
    app.kubernetes.io/version: latest
  name: test-opamp-bridge
  namespace: test
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-opamp-bridge
    app.kubernetes.io/instance: test.test
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: test-opamp-bridge
    app.kubernetes.io/part-of: opentelemetry
    app.kubernetes.io/version: latest
  name: test-opamp-bridge
  namespace: test
spec:
  ports:
  - name: opamp-bridge
    port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/component: opentelemetry-opamp-bridge
    app.kubernetes.io/instance: test.test
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
