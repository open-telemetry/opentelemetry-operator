# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: processor-k8sattributes-filter-namespace
spec:
  steps:
  - name: create-namespaces
    try:
    - apply:
        file: 00-install.yaml
  - name: filter-namespace
    try:
    - script:
        content: |
          VERSION=$(kubectl logs deployment/opentelemetry-operator-controller-manager \
            -n opentelemetry-operator-system | \
            grep -o '"collector-image":"[^"]*"' | head -1 | \
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          printf '%s' "${VERSION:-latest}"
        outputs:
          - name: collectorVersion
            value: ($stdout)
    - apply:
        template: true
        file: 01-install.yaml
    - assert:
        file: 01-assert.yaml
  - name: cleanup-verification
    try:
    - delete:
        ref:
          apiVersion: opentelemetry.io/v1beta1
          kind: OpenTelemetryCollector
          name: simplest
          namespace: chainsaw-k8sattr-filter-ns
    - script:
        timeout: 60s
        content: |
          for i in $(seq 1 30); do
            ROLE=$(kubectl get role simplest-k8sattr-filter-target-role -n k8sattr-filter-target --ignore-not-found -o name)
            RB=$(kubectl get rolebinding simplest-k8sattr-filter-target-rolebinding -n k8sattr-filter-target --ignore-not-found -o name)
            if [ -z "$ROLE" ] && [ -z "$RB" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Role or RoleBinding still exists after collector deletion"
          exit 1