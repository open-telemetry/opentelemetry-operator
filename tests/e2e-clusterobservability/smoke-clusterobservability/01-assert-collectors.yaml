apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cluster-obs-agent-collector
status:
  numberMisscheduled: 0
  (desiredNumberScheduled > `0` && desiredNumberScheduled == numberReady): true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cluster-obs-cluster-collector
status:
  readyReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink-collector
status:
  readyReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-obs-targetallocator-targetallocator
(metadata.generation >= `2`): true
(status.observedGeneration == metadata.generation): true
(status.replicas == spec.replicas): true
(status.updatedReplicas == spec.replicas): true
(status.readyReplicas == spec.replicas): true
(status.availableReplicas == spec.replicas): true
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  labels:
    kubernetes.io/service-name: cluster-obs-targetallocator-targetallocator
(length(endpoints[?conditions.ready == `true`]) > `0`): true
---
apiVersion: opentelemetry.io/v1alpha1
kind: ClusterObservability
metadata:
  name: cluster-obs
status:
  phase: Ready
  (conditions[?type == 'Ready']):
  - status: "True"
    reason: Ready
  componentsStatus:
    agent:
      ready: true
    cluster:
      ready: true
    instrumentation:
      ready: true
