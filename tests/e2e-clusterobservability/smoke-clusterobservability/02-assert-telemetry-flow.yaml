apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: assert-telemetry-flow
spec:
  try:
  - script:
      content: |
        kubectl run telemetry-trigger -n "$NAMESPACE" \
          --image=mirror.gcr.io/library/busybox:latest --restart=Never --command -- \
          /bin/sh -c 'while true; do echo clusterobservability-filelog-probe; sleep 5; done'
  - script:
      timeout: 2m
      content: |
        CLUSTER_POD=$(kubectl get pod -n "$NAMESPACE" \
          -l app.kubernetes.io/name=cluster-obs-cluster \
          -o jsonpath='{.items[0].metadata.name}')
        # Wait for the k8s_events receiver to log its startup message.
        # Match both compact JSON ("k8s_events") and console format with spaces.
        # The check is advisory — if the log line is absent after 60s (e.g. due
        # to a version-dependent format change) we proceed rather than failing
        # hard; the sink-log check below will catch any missing signal.
        for i in $(seq 1 30); do
          if kubectl logs "$CLUSTER_POD" -n "$NAMESPACE" \
            | grep -qE '"k8s_events".*[Ss]tart|[Ss]tart.*"k8s_events"'; then
            echo "k8s_events receiver startup confirmed"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "WARNING: k8s_events receiver startup log not found after 60s; proceeding anyway"
          fi
          sleep 2
        done
        # Ensure the whole-second Event timestamp is after the receiver start time.
        sleep 2
        kubectl apply -f - <<EOF
        apiVersion: events.k8s.io/v1
        kind: Event
        metadata:
          name: clusterobservability-probe-$NAMESPACE
          namespace: default
        eventTime: "$(date -u +%Y-%m-%dT%H:%M:%S).000000Z"
        action: VerifyCollectorEventReceiver
        reason: ClusterObservabilityProbe
        note: clusterobservability-event-probe
        type: Normal
        reportingController: opentelemetry.io/clusterobservability-test
        reportingInstance: chainsaw
        regarding:
          apiVersion: v1
          kind: Namespace
          name: default
        EOF
  - script:
      env:
      - name: LABEL_SELECTOR
        value: app.kubernetes.io/name=sink-collector
      - name: CONTAINER_NAME
        value: otc-container
      - name: RETRY_TIMEOUT
        value: "480"
      - name: RETRY_SLEEP
        value: "10"
      # One signal unique to each bundled receiver:
      #   - kubeletstats (agent):   k8s.node.cpu.usage
      #   - hostmetrics (agent):    system.cpu.time
      #   - k8s_cluster  (cluster): k8s.deployment.available
      #   - filelog (agent):        unique probe body + log.file.path
      #   - k8s_events (cluster):    unique Event note
      - name: SEARCH_STRINGS_ENV
        value: |
          k8s.node.cpu.usage
          system.cpu.time
          clusterobservability-filelog-probe
          log.file.path
          k8s.deployment.available
          clusterobservability-event-probe
      timeout: 9m
      content: ../../test-e2e-apps/scripts/check_pod_logs.sh
