# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-clusterobservability
spec:
  timeouts:
    apply: 30s
    assert: 5m
    cleanup: 2m
  steps:
  - name: Configure namespace pod security
    try:
    - script:
        content: |
          if ! kubectl api-resources --api-group=security.openshift.io -o name \
            | grep -q '^securitycontextconstraints'; then
            kubectl label namespace "$NAMESPACE" \
              pod-security.kubernetes.io/enforce=privileged --overwrite
          fi
  - name: Install sink and Target Allocator
    try:
    - apply:
        file: 00-install-prerequisites.yaml
    - assert:
        file: 00-assert-prerequisites.yaml
  - name: Install ClusterObservability
    try:
    - apply:
        file: 00-install.yaml
    - assert:
        file: 00-assert.yaml
  - name: Assert collectors are running
    try:
    - assert:
        file: 01-assert-collectors.yaml
  - name: Assert telemetry reaches the sink
    use:
      template: 02-assert-telemetry-flow.yaml
  - name: Assert OpenShift-specific security and kubelet TLS
    use:
      template: 02-assert-openshift.yaml
  - name: Assert instrumented app traces reach the sink
    try:
    - apply:
        bindings:
        - name: APP_IMAGE
          value: ghcr.io/open-telemetry/opentelemetry-operator/e2e-test-app-nodejs:main
        file: 03-install-app.yaml
    - assert:
        file: 03-assert-app.yaml
    # Spans travel app -> node agent -> sink; assert via the sink's span counter
    # rather than logs, which are dominated by metric debug output.
    - script:
        timeout: 5m
        content: |
          set -u
          APP_POD=$(kubectl get pod -n "$NAMESPACE" -l app=traces-demo -o jsonpath='{.items[0].metadata.name}')
          SINK_POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/name=sink-collector -o jsonpath='{.items[0].metadata.name}')
          echo "app=$APP_POD sink=$SINK_POD"
          for i in $(seq 1 30); do
            kubectl get --raw "/api/v1/namespaces/$NAMESPACE/pods/$APP_POD:3000/proxy/rolldice" >/dev/null 2>&1 || true
            spans=$(kubectl get --raw "/api/v1/namespaces/$NAMESPACE/pods/$SINK_POD:8888/proxy/metrics" 2>/dev/null \
              | grep -E '^otelcol_receiver_accepted_spans' | grep -vE ' 0$' || true)
            if [ -n "$spans" ]; then
              echo "spans received at sink:"; echo "$spans"; exit 0
            fi
            echo "attempt $i: no spans at sink yet"; sleep 10
          done
          echo "ERROR: no spans reached the sink"; exit 1
    catch:
    - podLogs:
        selector: app=traces-demo
  - name: Audit Collector and Target Allocator health
    use:
      template: 04-assert-component-health.yaml
  - name: Report a second ClusterObservability as conflicted
    try:
    - apply:
        file: 06-install-conflicting-clusterobservability.yaml
    - assert:
        file: 06-assert-conflicting-clusterobservability.yaml
    - script:
        content: |
          set -eu
          for resource in \
            opentelemetrycollector/cluster-obs-conflict-agent \
            opentelemetrycollector/cluster-obs-conflict-cluster \
            instrumentation/cluster-obs-conflict; do
            if kubectl get "$resource" -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "ERROR: conflicted ClusterObservability created $resource"
              exit 1
            fi
          done
  - name: Remove the conflict without affecting the active resource
    try:
    - delete:
        ref:
          apiVersion: opentelemetry.io/v1alpha1
          kind: ClusterObservability
          name: cluster-obs-conflict
    - assert:
        file: 00-assert.yaml
  - name: Cleanup
    try:
    - delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: traces-demo
    - script:
        timeout: 3m
        content: |
          set -eu
          has_scc=false
          if kubectl api-resources --api-group=security.openshift.io -o name \
            | grep -q '^securitycontextconstraints'; then
            has_scc=true
            kubectl get securitycontextconstraints.security.openshift.io \
              cluster-obs-agent-hostaccess >/dev/null
          fi

          kubectl delete clusterobservability cluster-obs -n "$NAMESPACE" --wait=false
          for resource in \
            clusterobservability/cluster-obs \
            opentelemetrycollector/cluster-obs-agent \
            opentelemetrycollector/cluster-obs-cluster \
            instrumentation/cluster-obs; do
            kubectl wait --for=delete "$resource" -n "$NAMESPACE" --timeout=2m
          done

          if [ "$has_scc" = true ]; then
            kubectl wait --for=delete \
              securitycontextconstraints.security.openshift.io/cluster-obs-agent-hostaccess \
              --timeout=2m
          fi
    - delete:
        ref:
          apiVersion: opentelemetry.io/v1beta1
          kind: OpenTelemetryCollector
          name: sink
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: telemetry-trigger
    - script:
        content: |
          kubectl delete event.events.k8s.io \
            "clusterobservability-probe-$NAMESPACE" -n default \
            --ignore-not-found
