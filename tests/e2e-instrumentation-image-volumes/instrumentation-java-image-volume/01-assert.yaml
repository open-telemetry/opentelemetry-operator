apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-java-image-volume
spec:
  (length(initContainers || `[]`)): 0
  (containers[?name == 'app']):
  - name: app
    (volumeMounts[?name == 'opentelemetry-auto-instrumentation-java']):
    - name: opentelemetry-auto-instrumentation-java
      mountPath: /otel-auto-instrumentation-java-app
  (volumes[?name == 'opentelemetry-auto-instrumentation-java']):
  - name: opentelemetry-auto-instrumentation-java
    image:
      reference: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.34.0-1
status:
  phase: Running
