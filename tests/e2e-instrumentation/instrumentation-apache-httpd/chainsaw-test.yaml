# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instrumentation-apache-httpd
spec:
  bindings:
    - name: podLabelSelector
      value: app=my-apache
    - name: appPort
      value: "8080"
    - name: appPath
      value: /
    - name: collectorLabelSelector
      value: app.kubernetes.io/name=deployment-collector
    - name: collectorMetricsPort
      value: "8888"
    - name: containerName
      value: otc-container
    - name: retryTimeout
      value: "120"
    - name: retrySleep
      value: "5"
    - name: searchStrings
      value: |
        k8s.container.name: Str(myapp)
        k8s.deployment.name: Str(my-apache)
    - name: catchPodLabelSelector
      value: app=my-apache
    - name: catchContainer
      value: otc-container
  steps:
  - name: Add OpenShift namespace annotations
    use:
      template: ../../step-templates/openshift-namespace-annotations.yaml
  - name: step-00
    try:
    - apply:
        file: 00-install-collector.yaml
    - apply:
        file: 00-install-instrumentation.yaml
    - sleep:
        duration: 1s
  - name: step-01
    try:
    - apply:
        file: 01-install-app.yaml
    - assert:
        file: 01-assert.yaml
    catch:
      - podLogs:
          selector: app=my-apache
  - name: Make a request to the app
    use:
      template: ../../step-templates/app-http-request.yaml
  - name: Wait for telemetry data
    use:
      template: ../../step-templates/wait-for-telemetry.yaml
  - name: Check the instrumented app has sent the telemetry data successfully
    use:
      template: ../../step-templates/validate-collector-spans.yaml
  - name: Setup SCC for DaemonSet hostNetwork
    try:
    - script:
        timeout: 1m
        content: |
          if kubectl api-resources --api-group=security.openshift.io -o name 2>/dev/null | grep -q securitycontextconstraints; then
            echo "OpenShift detected — creating SCC for hostNetwork"
            kubectl apply -f scc.yaml
            oc adm policy add-scc-to-user daemonset-with-hostport -z daemonset-collector -n $NAMESPACE
          else
            echo "Not OpenShift — skipping SCC setup"
          fi
  - name: Switch to node-IP exporter endpoint
    try:
    - apply:
        file: 02-install-daemonset-collector.yaml
    - apply:
        file: 02-update-instrumentation-nodeip.yaml
    - command:
        entrypoint: kubectl
        args:
          - get
          - pod
          - -n
          - ${NAMESPACE}
          - -l
          - app=my-apache
          - -o
          - jsonpath={.items[0].metadata.name}
        outputs:
        - name: apachePodName
          value: ($stdout)
    - command:
        entrypoint: kubectl
        args:
          - rollout
          - restart
          - deployment/my-apache
          - -n
          - ${NAMESPACE}
    - wait:
        apiVersion: v1
        kind: Pod
        name: ($apachePodName)
        namespace: ($namespace)
        timeout: 2m
        for:
          deletion: {}
    - assert:
        file: 02-assert-nodeip.yaml
    - script:
        timeout: 2m
        content: ./02-verify-endpoint-interpolation.sh
    catch:
      - podLogs:
          selector: app=my-apache
  - name: Make a request to the app via node-IP endpoint
    use:
      template: ../../step-templates/app-http-request.yaml
  - name: Wait for telemetry data via node-IP endpoint
    use:
      template: ../../step-templates/wait-for-telemetry.yaml
      with:
        bindings:
          - name: collectorLabelSelector
            value: app.kubernetes.io/name=daemonset-collector
  - name: Check the DaemonSet collector has sent the telemetry data successfully
    use:
      template: ../../step-templates/validate-collector-spans.yaml
      with:
        bindings:
          - name: collectorLabelSelector
            value: app.kubernetes.io/name=daemonset-collector
  - name: Cleanup SCC
    try:
    - script:
        timeout: 1m
        content: |
          if kubectl api-resources --api-group=security.openshift.io -o name 2>/dev/null | grep -q securitycontextconstraints; then
            kubectl delete scc daemonset-with-hostport --ignore-not-found
          fi
