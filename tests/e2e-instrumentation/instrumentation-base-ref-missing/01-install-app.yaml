apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-ref-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: base-ref-missing
  template:
    metadata:
      labels:
        app: base-ref-missing
      annotations:
        instrumentation.opentelemetry.io/inject-java: java-local
    spec:
      nodeSelector:
        e2e.opentelemetry.io/no-node: "true"
      containers:
      - name: app
        image: busybox:1.36.1
        command: [sh, -c, "sleep 3600"]
