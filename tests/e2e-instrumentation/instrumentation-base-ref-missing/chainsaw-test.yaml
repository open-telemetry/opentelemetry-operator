# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instrumentation-base-ref-missing
spec:
  steps:
  - name: Create an Instrumentation with a missing base reference
    try:
    - apply:
        file: 00-install-instrumentations.yaml
  - name: Create an application Pod with a missing common Instrumentation
    try:
    - apply:
        file: 01-install-app.yaml
    - script:
        env:
        - name: TEST_NAMESPACE
          value: ($namespace)
        - name: MISSING_BASE_NAME
          value: java-base-never-created
        timeout: 2m
        content: ./01-wait-for-missing-base-log.sh
        check:
          ($error != null): false
    - assert:
        file: 01-assert.yaml
