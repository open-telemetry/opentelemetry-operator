apiVersion: v1
kind: Pod
metadata:
  name: base-ref-first-before
  annotations:
    instrumentation.opentelemetry.io/inject-java: java-local
spec:
  # Admission produces the Pod spec before scheduling; no image pull is needed.
  nodeSelector:
    e2e.opentelemetry.io/no-node: "true"
  containers:
  - name: app
    image: busybox:1.36.1
    command: [sh, -c, "sleep 3600"]
    env:
    - name: POD_PRIORITY
      value: pod
---
apiVersion: v1
kind: Pod
metadata:
  name: base-ref-second-before
  namespace: ($secondNamespace)
  annotations:
    instrumentation.opentelemetry.io/inject-java: java-local
spec:
  nodeSelector:
    e2e.opentelemetry.io/no-node: "true"
  containers:
  - name: app
    image: busybox:1.36.1
    command: [sh, -c, "sleep 3600"]
