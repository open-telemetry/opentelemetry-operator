apiVersion: v1
kind: Pod
metadata:
  name: base-ref-first-after
  annotations:
    instrumentation.opentelemetry.io/inject-java: java-local
spec:
  nodeSelector:
    e2e.opentelemetry.io/no-node: "true"
  containers:
  - name: app
    image: busybox:1.36.1
    command: [sh, -c, "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: base-ref-second-after
  namespace: ($secondNamespace)
  annotations:
    instrumentation.opentelemetry.io/inject-java: java-local
spec:
  nodeSelector:
    e2e.opentelemetry.io/no-node: "true"
  containers:
  - name: app
    image: busybox:1.36.1
    command: [sh, -c, "sleep 3600"]
