apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-php-manual
spec:
  selector:
    matchLabels:
      app: my-php-manual
  replicas: 1
  template:
    metadata:
      labels:
        app: my-php-manual
      annotations:
        instrumentation.opentelemetry.io/inject-php: "true"
        instrumentation.opentelemetry.io/otel-php-api-version: "20240924"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 3000
      containers:
      - name: myapp
        ports:
        - containerPort: 8080
        image: ghcr.io/jerrytfleung/opentelemetry-operator/e2e-test-app-php:main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3
