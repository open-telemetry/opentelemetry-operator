apiVersion: v1
kind: Pod
metadata:
  annotations:
    instrumentation.opentelemetry.io/inject-ruby: "true"
  labels:
    app: my-ruby
spec:
  (initContainers[?name == 'opentelemetry-auto-instrumentation-ruby'] | length(@)): 1
  (containers[?name == 'myapp']):
    - name: myapp
      (env[?name == 'OTEL_OPERATOR']):
        - name: OTEL_OPERATOR
          value: "true"
      (env[?name == 'RUBYOPT']):
        - name: RUBYOPT
          value: " -r /otel-auto-instrumentation-ruby/src/autoinstrumentation"
      (volumeMounts[?name == 'opentelemetry-auto-instrumentation-ruby']):
        - mountPath: /otel-auto-instrumentation-ruby
          name: opentelemetry-auto-instrumentation-ruby
status:
  (containerStatuses[?name == 'myapp']):
    - name: myapp
      ready: true
      started: true
  phase: Running
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: deployment-collector
  name: deployment-collector
status:
  availableReplicas: 1
  readyReplicas: 1
