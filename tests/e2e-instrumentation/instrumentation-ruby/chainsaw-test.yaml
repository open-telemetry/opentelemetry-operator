# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instrumentation-ruby
spec:
  bindings:
    - name: appImage
      value: ghcr.io/open-telemetry/opentelemetry-operator/e2e-test-app-ruby:main
    - name: podLabelSelector
      value: app=my-ruby
    - name: appPort
      value: "8080"
    - name: appPath
      value: /rolldice
    - name: collectorLabelSelector
      value: app.kubernetes.io/name=deployment-collector
    - name: collectorMetricsPort
      value: "8888"
    - name: containerName
      value: otc-container
    - name: retryTimeout
      value: "240"
    - name: retrySleep
      value: "5"
    - name: searchStrings
      value: "k8s.container.name: Str(myapp)"
    - name: catchPodLabelSelector
      value: app.kubernetes.io/name=deployment-collector
    - name: catchContainer
      value: otc-container
  steps:
    - name: Add OpenShift namespace annotations
      use:
        template: ../../step-templates/openshift-namespace-annotations.yaml
    - name: Setup instrumentation and collector
      try:
        - apply:
            file: 00-install-collector.yaml
        - apply:
            file: 00-install-instrumentation.yaml
        - sleep:
            duration: 1s
    - name: Install test app
      try:
        - apply:
            file: 01-install-app.yaml
        - assert:
            file: 01-assert.yaml
      catch:
        - podLogs:
            selector: app=my-ruby
    - name: Make a request to the app
      use:
        template: ../../step-templates/app-http-request.yaml
    - name: Wait for telemetry data
      use:
        template: ../../step-templates/wait-for-telemetry.yaml
    - name: Check the instrumented app sent spans
      use:
        template: ../../step-templates/validate-collector-spans.yaml
