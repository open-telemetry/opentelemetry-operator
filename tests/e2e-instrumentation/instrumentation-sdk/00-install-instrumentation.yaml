apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: sdk-only
spec:
  env:
    - name: SPLUNK_TRACE_RESPONSE_HEADER_ENABLED
      value: "true"
  exporter:
    endpoint: http://deployment-collector:4317
  propagators:
    - jaeger
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "0.25"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0-1
    env:
      - name: OTEL_NODEJS_DEBUG
        value: "true"
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.65b0-1
    env:
      - name: OTEL_ENV_VAR
        value: "true"
