apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: multi
spec:
  env:
    - name: OTEL_TRACES_SAMPLER
      value: parentbased_traceidratio
    - name: OTEL_TRACES_SAMPLER_ARG
      value: "0.85"
  exporter:
    endpoint: http://deployment-collector:4317
  propagators:
    - jaeger
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "0.25"
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.30.0-1
    env:
      - name: OTEL_SERVICE_NAME
        value: "javaapp"
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.65b0-1
    env:
      - name: OTEL_SERVICE_NAME
        value: "pythonapp"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://deployment-collector:4318
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0-1
    env:
      - name: OTEL_SERVICE_NAME
        value: "nodejsapp"
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.16.0-1
    env:
      - name: OTEL_SERVICE_NAME
        value: "dotnetapp"
  go:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:v0.24.0
    env:
      - name: OTEL_SERVICE_NAME
        value: "goapp"
