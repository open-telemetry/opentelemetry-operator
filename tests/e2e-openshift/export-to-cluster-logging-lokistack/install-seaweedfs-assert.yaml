apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: seaweedfs
  name: seaweedfs
  namespace: openshift-logging
status:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  phase: Bound

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: openshift-logging
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: openshift-logging
spec:
  ports:
  - name: s3
    port: 8333
    protocol: TCP
    targetPort: 8333
  selector:
    app.kubernetes.io/name: seaweedfs
  type: ClusterIP
