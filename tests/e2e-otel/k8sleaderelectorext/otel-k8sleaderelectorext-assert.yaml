apiVersion: v1
kind: Namespace
metadata:
  name: chainsaw-k8sleaderelectorext
spec:
  finalizers:
  - kubernetes
status:
  phase: Active

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainsaw-k8sleaderelectorext
  namespace: chainsaw-k8sleaderelectorext

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chainsaw-k8sleaderelectorext-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/spec
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - daemonsets
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quota.openshift.io
  resources:
  - clusterresourcequotas
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chainsaw-k8sleaderelectorext-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chainsaw-k8sleaderelectorext-role
subjects:
- kind: ServiceAccount
  name: chainsaw-k8sleaderelectorext
  namespace: chainsaw-k8sleaderelectorext

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chainsaw-k8sleaderelectorext-lease-role
  namespace: chainsaw-k8sleaderelectorext
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chainsaw-k8sleaderelectorext-lease-binding
  namespace: chainsaw-k8sleaderelectorext
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chainsaw-k8sleaderelectorext-lease-role
subjects:
- kind: ServiceAccount
  name: chainsaw-k8sleaderelectorext
  namespace: chainsaw-k8sleaderelectorext

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainsaw-k8sleaderelectorext-collector
  namespace: chainsaw-k8sleaderelectorext
status:
  availableReplicas: 2
  readyReplicas: 2
  replicas: 2
