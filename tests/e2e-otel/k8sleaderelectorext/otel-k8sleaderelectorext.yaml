apiVersion: v1
kind: Namespace
metadata:
  name: chainsaw-k8sleaderelectorext

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainsaw-k8sleaderelectorext
  namespace: chainsaw-k8sleaderelectorext

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chainsaw-k8sleaderelectorext-role
rules:
- apiGroups:
  - ''
  resources:
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/spec
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - daemonsets
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quota.openshift.io
  resources:
  - clusterresourcequotas
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chainsaw-k8sleaderelectorext-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chainsaw-k8sleaderelectorext-role
subjects:
  - kind: ServiceAccount
    name: chainsaw-k8sleaderelectorext
    namespace: chainsaw-k8sleaderelectorext

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chainsaw-k8sleaderelectorext-lease-role
  namespace: chainsaw-k8sleaderelectorext
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chainsaw-k8sleaderelectorext-lease-binding
  namespace: chainsaw-k8sleaderelectorext
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chainsaw-k8sleaderelectorext-lease-role
subjects:
  - kind: ServiceAccount
    name: chainsaw-k8sleaderelectorext
    namespace: chainsaw-k8sleaderelectorext

---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: chainsaw-k8sleaderelectorext
  namespace: chainsaw-k8sleaderelectorext
spec:
  mode: deployment
  replicas: 2
  serviceAccount: chainsaw-k8sleaderelectorext
  config: |
    extensions:
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: otel-k8sclusterreceiver-leader
        lease_namespace: chainsaw-k8sleaderelectorext
    receivers:
      k8s_cluster:
        distribution: openshift
        collection_interval: 15s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
        allocatable_types_to_report:
          - cpu
          - memory
        k8s_leader_elector: k8s_leader_elector
    exporters:
      debug:
        verbosity: detailed
    service:
      extensions: [k8s_leader_elector]
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          exporters: [debug]
