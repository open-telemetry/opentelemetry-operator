apiVersion: v1
kind: Secret
metadata:
  name: collector
  annotations:
    kubernetes.io/service-account.name: collector
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name:  (join('-', ['opentelemetry-operator-controller-manager-cert-manager-role', $namespace]))
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - certificaterequests
  - certificates
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: (join('-', ['opentelemetry-operator-controller-manager-cert-manager-role', $namespace]))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: (join('-', ['opentelemetry-operator-controller-manager-cert-manager-role', $namespace]))
subjects:
- kind: ServiceAccount
  name: opentelemetry-operator-controller-manager
  namespace: opentelemetry-operator-system
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: prometheus-cr-v1beta1
spec:
  config:
    receivers:
      prometheus:
        config:
          scrape_configs: []

    processors:

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheus]
      telemetry:
        logs:
          level: "DEBUG"
          development: true
          encoding: "json"
  mode: statefulset
  serviceAccount: collector
  targetAllocator:
    enabled: true
    mtls:
      enabled: true
      useCertManager: true
    prometheusCR:
      enabled: true
      scrapeInterval: 1s
      scrapeConfigSelector: {}
    serviceAccount: ta
