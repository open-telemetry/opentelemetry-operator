apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: (join('-', ['collector', $namespace]))
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - namespaces
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - watch
  - list
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: (join('-', ['collector', $namespace]))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: (join('-', ['collector', $namespace]))
subjects:
- kind: ServiceAccount
  name: collector
  namespace: ($namespace)
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: prometheus-cr
spec:
  config:
    receivers:
      prometheus:
        config:
          scrape_configs: []
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheus]
  mode: statefulset
  serviceAccount: collector
  targetAllocator:
    enabled: true
    mtls:
      enabled: true
      useCertManager: false
      tls:
        # CA sourced from a ConfigMap (key defaults to ca.crt).
        certificateAuthorityCertificate:
          configMap:
            name: mtls-ca
        # Server certificate and private key in two separate Secrets (keys default to tls.crt/tls.key).
        serverCertificate:
          certificateSecret:
            name: ta-server-cert
          keySecret:
            name: ta-server-key
        clientCertificate:
          certificateSecret:
            name: ta-client-cert
          keySecret:
            name: ta-client-cert
    prometheusCR:
      enabled: true
      scrapeInterval: 1s
      serviceMonitorSelector: {}
      podMonitorSelector: {}
    serviceAccount: ta
---
apiVersion: batch/v1
kind: Job
metadata:
  name: check-ta-serving-over-https
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: check-ta
          image: mirror.gcr.io/alpine/curl:latest
          volumeMounts:
            - name: client-cert
              mountPath: /etc/tls
              readOnly: true
            - name: ca
              mountPath: /etc/ca
              readOnly: true
          args:
            - /bin/sh
            - -c
            - |
              curl -s \
                --cert /etc/tls/tls.crt \
                --key /etc/tls/tls.key \
                --cacert /etc/ca/ca.crt \
                https://prometheus-cr-targetallocator:443
      volumes:
        - name: client-cert
          secret:
            secretName: ta-client-cert
        - name: ca
          configMap:
            name: mtls-ca
