apiVersion: opentelemetry.io/v1alpha1
kind: TargetAllocator
metadata:
  name: prometheus-cr
spec:
  serviceAccount: ta
  mtls:
    enabled: true
    useCertManager: false
    tls:
      certificateAuthorityCertificate:
        configMap:
          name: mtls-ca
      serverCertificate:
        certificateSecret:
          name: ta-server-cert
        keySecret:
          name: ta-server-key
  prometheusCR:
    enabled: true
    scrapeInterval: 1s
    serviceMonitorSelector: {}
    podMonitorSelector: {}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: prometheus-cr
  labels:
    opentelemetry.io/target-allocator: prometheus-cr
spec:
  config:
    receivers:
      prometheus:
        config:
          scrape_configs: []
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheus]
  mode: statefulset
  serviceAccount: collector
---
apiVersion: batch/v1
kind: Job
metadata:
  name: check-ta2-serving-over-https
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: check-ta
          image: mirror.gcr.io/alpine/curl:latest
          volumeMounts:
            - name: client-cert
              mountPath: /etc/tls
              readOnly: true
            - name: ca
              mountPath: /etc/ca
              readOnly: true
          args:
            - /bin/sh
            - -c
            - |
              curl -s \
                --cert /etc/tls/tls.crt \
                --key /etc/tls/tls.key \
                --cacert /etc/ca/ca.crt \
                https://prometheus-cr-targetallocator:443
      volumes:
        - name: client-cert
          secret:
            secretName: ta-client-cert
        - name: ca
          configMap:
            name: mtls-ca
