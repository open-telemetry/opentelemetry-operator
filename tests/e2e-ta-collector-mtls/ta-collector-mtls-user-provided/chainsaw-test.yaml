# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: targetallocator-collector-mtls-user-provided
spec:
  steps:
    - name: Setup Target Allocator RBAC
      use:
        template: ../../step-templates/target-allocator-rbac-comprehensive.yaml
    - name: generate-user-provided-certs
      try:
        - command:
            entrypoint: bash
            args:
              - -c
              - |
                set -euo pipefail
                dir=$(mktemp -d)
                cd "$dir"

                # CA
                openssl genrsa -out ca.key 2048
                openssl req -x509 -new -noenc -key ca.key -subj "/CN=ta-mtls-ca" -days 1 -out ca.crt

                # Server
                openssl genrsa -out server.key 2048
                openssl req -new -key server.key -subj "/CN=prometheus-cr-targetallocator" -out server.csr
                openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                  -out server.crt -days 1 \
                  -extfile <(printf "subjectAltName=DNS:prometheus-cr-targetallocator")

                # Client
                openssl genrsa -out client.key 2048
                openssl req -new -key client.key -subj "/CN=prometheus-cr-collector" -out client.csr
                openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                  -out client.crt -days 1

                # Distribute certs
                kubectl create cm mtls-ca -n "$NAMESPACE" --from-file=ca.crt=ca.crt

                kubectl create secret generic ta-server-cert -n "$NAMESPACE" --from-file=tls.crt=server.crt
                kubectl create secret generic ta-server-key -n "$NAMESPACE" --from-file=tls.key=server.key

                kubectl create secret tls ta-client-cert -n "$NAMESPACE" --cert=client.crt --key=client.key
    - name: step-00
      try:
        - apply:
            template: true
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/managed-by=opentelemetry-operator
