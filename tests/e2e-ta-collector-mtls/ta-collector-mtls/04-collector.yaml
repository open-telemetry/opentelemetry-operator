apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: certmanager-availability-probe
spec:
  mode: statefulset
  targetAllocator:
    enabled: true
    mtls:
      enabled: true
      useCertManager: true
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
          - job_name: collector
            static_configs:
            - targets: ["127.0.0.1:8888"]
    exporters:
      debug: {}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [debug]
