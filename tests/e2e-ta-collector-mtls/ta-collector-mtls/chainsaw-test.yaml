# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: targetallocator-collector-mtls
spec:
  # The operator's cert-manager permissions are shared by all tests.
  concurrent: false
  namespace: chainsaw-targetallocator-collector-mtls
  steps:
    - name: Setup Target Allocator RBAC
      use:
        template: ../../step-templates/target-allocator-rbac-comprehensive.yaml
    - name: Setup Collector RBAC
      use:
        template: ../../step-templates/collector-with-target-allocator-rbac-comprehensive.yaml
    - name: step-00
      try:
        - apply:
            template: true
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/managed-by=opentelemetry-operator
    - name: step-01
      try:
        - apply:
            file: 01-install.yaml
        - assert:
            file: 01-assert.yaml
    - name: step-02
      try:
        - apply:
            template: true
            file: 02-install.yaml
        - assert:
            file: 02-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/managed-by=opentelemetry-operator
    - name: step-02b-capture-cert-date
      try:
        - apply:
            template: true
            file: 02b-install.yaml
        - assert:
            file: 02b-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/managed-by=opentelemetry-operator
    - name: step-03
      try:
        - command:
            entrypoint: bash
            args:
              - -c
              - "$(git rev-parse --show-toplevel)/bin/cmctl renew prometheus-cr-ta-server-cert -n ${NAMESPACE}"
        - sleep:
            duration: 30s
        - apply:
            template: true
            file: 03-install.yaml
        - assert:
            file: 03-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/managed-by=opentelemetry-operator
    - name: cert-manager-availability-changes
      bindings:
        - name: operatorRole
          value: (x_k8s_get($client, 'rbac.authorization.k8s.io/v1', 'ClusterRole', '', 'opentelemetry-operator-manager-role'))
      try:
        - apply:
            file: 04-collector.yaml
            dryRun: true
        - command:
            entrypoint: kubectl
            args:
              - get
              - pods
              - -n
              - opentelemetry-operator-system
              - -l
              - app.kubernetes.io/name=opentelemetry-operator,control-plane=controller-manager
              - -o
              - json
            outputs:
              - name: controller
                value: (json_parse($stdout).items[0])
              - name: initialRestarts
                value: (json_parse($stdout).items[0].status.containerStatuses[?name == 'manager'].restartCount | [0])
        - patch:
            file: 04-revoke-rbac.yaml
        - assert:
            file: 04-assert-restart.yaml
        - apply:
            file: 04-collector.yaml
            dryRun: true
            timeout: 3m
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'mTLS is enabled with useCertManager but cert-manager is not available')): true
      finally:
        - script:
            timeout: 4m
            env:
              - name: ROLE_RULES
                value: (to_string($operatorRole.rules))
            content: |
              set -e
              kubectl patch clusterrole opentelemetry-operator-manager-role --type=merge -p "{\"rules\":$ROLE_RULES}"
              for _attempt in $(seq 1 90); do
                if kubectl --request-timeout=10s create --dry-run=server -n "$NAMESPACE" -f 04-collector.yaml; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
