# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: targetallocator-mtls-disable
spec:
  steps:
    - name: Setup Target Allocator RBAC
      use:
        template: ../../step-templates/target-allocator-rbac-comprehensive.yaml
    - name: step-00
      try:
        - apply:
            template: true
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-targetallocator
    # the operator created the cert-manager resources, so it deletes them once mTLS is off
    - name: step-01
      try:
        - apply:
            template: true
            file: 01-disable-mtls.yaml
        - error:
            file: 01-error.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-targetallocator
