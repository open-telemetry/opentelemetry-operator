apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-targetallocator
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: ta-retry-crds-targetallocator
  name: ta-retry-crds-targetallocator
status:
  readyReplicas: 1
  replicas: 1
---
# Verify the operator rendered retry_missing_crds and wait_for_crds into the TA configmap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ta-retry-crds-targetallocator
data:
  targetallocator.yaml:
    (contains(@, 'retry_missing_crds: true')): true
    (contains(@, 'wait_for_crds')): true
    (contains(@, '- servicemonitors')): true
    (contains(@, '- podmonitors')): true
