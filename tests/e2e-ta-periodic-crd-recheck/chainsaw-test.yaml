# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ta-periodic-crd-recheck
spec:
  steps:
  - name: Add OpenShift namespace annotations
    use:
      template: ../step-templates/openshift-namespace-annotations.yaml
  - name: Setup Target Allocator RBAC
    use:
      template: ../step-templates/target-allocator-rbac.yaml
      with:
        bindings:
          - name: serviceAccountName
            value: ta-retry-crds
          - name: clusterRoleName
            value: (join('-', ['ta-retry-crds', $namespace]))
          - name: clusterRoleBindingName
            value: (join('-', ['ta-retry-crds', $namespace]))
  - name: step-00 - Deploy TA with retryMissingCRDs enabled, verify configmap
    try:
    - apply:
        template: true
        file: 00-install.yaml
    - assert:
        file: 00-assert.yaml
    catch:
    - podLogs:
        selector: app.kubernetes.io/component=opentelemetry-targetallocator
