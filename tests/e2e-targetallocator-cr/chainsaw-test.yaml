# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: targetallocator-cr
spec:
  steps:
  - name: Add OpenShift namespace annotations
    use:
      template: ../step-templates/openshift-namespace-annotations.yaml
  - name: Setup Target Allocator RBAC
    use:
      template: ../step-templates/target-allocator-rbac.yaml
      with:
        bindings:
          - name: serviceAccountName
            value: cr-targetallocator
          - name: clusterRoleName
            value: targetallocator-prometheuscr
          - name: clusterRoleBindingName
            value: (join('-', ['ta', $namespace]))
  - name: Setup a user-provided service account
    use:
      template: ../step-templates/target-allocator-rbac.yaml
      with:
        bindings:
          - name: serviceAccountName
            value: cr-ta-user
          - name: clusterRoleName
            value: (join('-', ['targetallocator-user', $namespace]))
          - name: clusterRoleBindingName
            value: (join('-', ['ta-user', $namespace]))
  - name: step-00
    try:
    - apply:
        template: true
        file: 00-install.yaml
    - assert:
        file: 00-assert.yaml
    - apply:
        template: true
        file: 01-install.yaml
    - assert:
        file: 01-assert.yaml
    # the service account the operator created is no longer needed once the Target Allocator
    # points at a user-provided one, so the operator deletes it
    - error:
        file: 01-error.yaml
    catch:
    - podLogs:
        selector: app.kubernetes.io/component=opentelemetry-targetallocator
