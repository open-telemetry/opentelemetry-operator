# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: targetallocator-networkpolicy-apiserver-endpoints
spec:
  # The API server EndpointSlice created in step-01 is added to every target allocator NetworkPolicy in the cluster.
  concurrent: false
  bindings:
  - name: apiServerService
    value: (x_k8s_get($client, 'v1', 'Service', 'default', 'kubernetes'))
  - name: apiServerEndpoints
    value: (x_k8s_get($client, 'discovery.k8s.io/v1', 'EndpointSlice', 'default', 'kubernetes'))
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install.yaml
    - assert:
        file: 00-assert.yaml
    catch:
    - podLogs:
        selector: app.kubernetes.io/name=opentelemetry-operator
  # the NetworkPolicy follows changes to the API server's endpoints, which happen e.g. during a control plane upgrade
  - name: step-01
    try:
    - apply:
        file: 01-install.yaml
    - assert:
        file: 01-assert.yaml
    catch:
    - podLogs:
        selector: app.kubernetes.io/name=opentelemetry-operator
