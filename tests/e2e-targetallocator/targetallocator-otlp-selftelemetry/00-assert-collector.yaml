# Collector statefulset is ready.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ta-selftelemetry-collector
  namespace: ($namespace)
status:
  readyReplicas: 1

---
# Collector pod is running.
apiVersion: v1
kind: Pod
metadata:
  namespace: ($namespace)
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/name: ta-selftelemetry-collector
status:
  phase: Running
  containerStatuses:
    - name: otc-container
      ready: true
      started: true
