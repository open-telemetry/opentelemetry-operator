# Collector statefulset is ready.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ta-selftelemetry-collector
  namespace: ($namespace)
status:
  readyReplicas: 1

---
# TA deployment is ready and has finished rolling out its current pod template
# (updatedReplicas guards against matching a stale pod from a prior revision
# when this file is reused after patching the TA telemetry config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-selftelemetry-targetallocator
  namespace: ($namespace)
status:
  readyReplicas: 1
  updatedReplicas: 1

---
# Collector pod is running.
apiVersion: v1
kind: Pod
metadata:
  namespace: ($namespace)
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/name: ta-selftelemetry-collector
status:
  phase: Running
  containerStatuses:
    - name: otc-container
      ready: true
      started: true

---
# TA pod is running.
apiVersion: v1
kind: Pod
metadata:
  namespace: ($namespace)
  labels:
    app.kubernetes.io/component: opentelemetry-targetallocator
    app.kubernetes.io/name: ta-selftelemetry-targetallocator
status:
  phase: Running
  containerStatuses:
    - name: ta-container
      ready: true
      started: true
