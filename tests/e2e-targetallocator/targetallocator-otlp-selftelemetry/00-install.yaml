# Single collector with TargetAllocator. The TA exports its own metrics via OTLP
# back to the same collector (otlp receiver), which logs them via the debug exporter.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ta-selftelemetry
spec:
  mode: statefulset
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: collector-self
              static_configs:
                - targets: ['0.0.0.0:8888']
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics/prometheus:
          receivers: [prometheus]
          exporters: [debug]
        metrics/selftelemetry:
          receivers: [otlp]
          exporters: [debug]
  # TargetAllocator is enabled in a later step, once the collector's Service
  # ClusterIP is known, so its pod is created exactly once, already configured
  # with the resolved IP. This avoids both depending on in-cluster DNS
  # resolution and replacing the TA pod mid-test (see chainsaw-test.yaml).
