# Single collector with TargetAllocator. The TA exports its own metrics via OTLP
# back to the same collector (otlp receiver), which logs them via the debug exporter.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ta-selftelemetry
spec:
  mode: statefulset
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: collector-self
              static_configs:
                - targets: ['0.0.0.0:8888']
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics/prometheus:
          receivers: [prometheus]
          exporters: [debug]
        metrics/selftelemetry:
          receivers: [otlp]
          exporters: [debug]
  targetAllocator:
    enabled: true
    serviceAccount: ta
    telemetry:
      metrics:
        readers:
          - periodic:
              # Short interval so more export attempts fit in the wait window,
              # increasing odds of catching a gap in transient DNS packet loss.
              interval: 5s
              exporter:
                otlpGrpc:
                  # Trailing dot makes this an absolute name, so the resolver (which
                  # honors /etc/resolv.conf ndots rules) skips search-domain expansion
                  # entirely instead of issuing several extra queries per lookup before
                  # trying the name as-is; fewer UDP round trips means fewer chances to
                  # hit transient DNS packet loss in kind.
                  endpoint: "ta-selftelemetry-collector.${env:OTELCOL_NAMESPACE}.svc.cluster.local.:4317"
                  tls:
                    insecure: true
