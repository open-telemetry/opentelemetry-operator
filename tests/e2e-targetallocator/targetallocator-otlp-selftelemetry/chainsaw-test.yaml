# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: targetallocator-otlp-selftelemetry
spec:
  steps:
    - name: Setup Target Allocator RBAC
      use:
        template: ../../step-templates/target-allocator-rbac-comprehensive.yaml
        with:
          bindings:
            - name: clusterRoleName
              value: ta-selftelemetry-targetallocator

    - name: Install collector with TA OTLP self-telemetry
      try:
        - apply:
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-targetallocator
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-collector

    - name: Point TA self-telemetry at the collector's ClusterIP
      try:
        # Target the collector Service's ClusterIP directly instead of its DNS name.
        # In-cluster DNS resolution (pod -> CoreDNS) has proven unreliable under load
        # in kind, causing this test to fail almost every CI run even with generous
        # retries and an FQDN. Using the ClusterIP sidesteps CoreDNS entirely for the
        # TA -> collector OTLP export, at the cost of no longer exercising the
        # DNS-based endpoint path a real user would typically configure.
        - script:
            content: |
              #!/bin/sh
              set -eu
              kubectl get service ta-selftelemetry-collector -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}'
            outputs:
              - name: collectorClusterIP
                value: ($stdout)
        - script:
            env:
              - name: COLLECTOR_CLUSTER_IP
                value: ($collectorClusterIP)
            content: |
              #!/bin/sh
              set -eu
              kubectl patch opentelemetrycollector ta-selftelemetry -n ${NAMESPACE} --type merge -p "$(cat <<EOF
              {
                "spec": {
                  "targetAllocator": {
                    "telemetry": {
                      "metrics": {
                        "readers": [
                          {
                            "periodic": {
                              "interval": "5s",
                              "exporter": {
                                "otlpGrpc": {
                                  "endpoint": "${COLLECTOR_CLUSTER_IP}:4317",
                                  "tls": {
                                    "insecure": true
                                  }
                                }
                              }
                            }
                          }
                        ]
                      }
                    }
                  }
                }
              }
              EOF
              )"
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-targetallocator
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-collector

    - name: Wait for collector to receive TA metrics via OTLP
      use:
        template: ../../step-templates/wait-for-telemetry.yaml
        with:
          bindings:
            - name: collectorLabelSelector
              value: app.kubernetes.io/name=ta-selftelemetry-collector
            - name: containerName
              value: otc-container
            - name: retryTimeout
              value: "120"
            - name: retrySleep
              value: "5"
            - name: catchPodLabelSelector
              value: app.kubernetes.io/component=opentelemetry-targetallocator
            - name: catchContainer
              value: ta-container
            # TA-specific Prometheus metrics bridged to OTLP; their presence in
            # the collector debug logs proves the TA self-telemetry pipeline works end-to-end.
            - name: searchStrings
              value: |-
                opentelemetry_allocator_targets
                opentelemetry_allocator_collectors_discovered
