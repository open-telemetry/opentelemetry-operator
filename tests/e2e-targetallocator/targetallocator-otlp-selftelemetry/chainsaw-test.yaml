# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: targetallocator-otlp-selftelemetry
spec:
  steps:
    - name: Setup Target Allocator RBAC
      use:
        template: ../../step-templates/target-allocator-rbac-comprehensive.yaml
        with:
          bindings:
            - name: clusterRoleName
              value: ta-selftelemetry-targetallocator

    - name: Install collector
      try:
        - apply:
            file: 00-install.yaml
        - assert:
            file: 00-assert-collector.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-collector

    - name: Enable TA with self-telemetry targeting the collector's pod IP
      try:
        # Target the collector pod's IP directly instead of its DNS name or Service
        # ClusterIP. DNS resolution and ClusterIP dialing (which goes through
        # kube-proxy's iptables DNAT) have both shown persistent, 100%-reproducible
        # "dial tcp ...: i/o timeout" failures in this CI environment regardless of
        # test structure (mid-test pod replacement vs. TA created fresh, parallel
        # test execution vs. serialized). Dialing the pod IP directly bypasses
        # kube-proxy's Service DNAT path entirely, isolating whether the failure is
        # specific to ClusterIP DNAT handling on kind-on-GH-Actions runners.
        - script:
            content: |
              #!/bin/sh
              set -eu
              kubectl get pod -n ${NAMESPACE} -l app.kubernetes.io/name=ta-selftelemetry-collector -o jsonpath='{.items[0].status.podIP}'
            outputs:
              - name: collectorPodIP
                value: ($stdout)
        - script:
            env:
              - name: COLLECTOR_POD_IP
                value: ($collectorPodIP)
            content: |
              #!/bin/sh
              set -eu
              kubectl patch opentelemetrycollector ta-selftelemetry -n ${NAMESPACE} --type merge -p "$(cat <<EOF
              {
                "spec": {
                  "targetAllocator": {
                    "enabled": true,
                    "serviceAccount": "ta",
                    "telemetry": {
                      "metrics": {
                        "readers": [
                          {
                            "periodic": {
                              "interval": "5s",
                              "exporter": {
                                "otlpGrpc": {
                                  "endpoint": "${COLLECTOR_POD_IP}:4317",
                                  "tls": {
                                    "insecure": true
                                  }
                                }
                              }
                            }
                          }
                        ]
                      }
                    }
                  }
                }
              }
              EOF
              )"
        - assert:
            file: 00-assert.yaml
      catch:
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-targetallocator
        - podLogs:
            selector: app.kubernetes.io/component=opentelemetry-collector

    - name: Wait for collector to receive TA metrics via OTLP
      use:
        template: ../../step-templates/wait-for-telemetry.yaml
        with:
          bindings:
            - name: collectorLabelSelector
              value: app.kubernetes.io/name=ta-selftelemetry-collector
            - name: containerName
              value: otc-container
            - name: retryTimeout
              value: "180"
            - name: retrySleep
              value: "5"
            - name: catchPodLabelSelector
              value: app.kubernetes.io/component=opentelemetry-targetallocator
            - name: catchContainer
              value: ta-container
            # TA-specific Prometheus metrics bridged to OTLP; their presence in
            # the collector debug logs proves the TA self-telemetry pipeline works end-to-end.
            - name: searchStrings
              value: |-
                opentelemetry_allocator_targets
                opentelemetry_allocator_collectors_discovered
