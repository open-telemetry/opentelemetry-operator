# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instrumentation-blocked-upgrade
spec:
  # This test modifies the operator deployment to verify upgrade blocking behavior.
  steps:
  - name: Create instrumentation with blocked dotnet and java versions and verify webhook warnings
    try:
    - script:
        timeout: 60s
        shell: /bin/bash
        content: |
          #!/bin/bash
          set -eo pipefail

          NS=opentelemetry-operator-system
          DEPLOY=opentelemetry-operator-controller-manager

          CSV_NAME=$(kubectl get csv -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -i opentelemetry | head -1 || true)
          if [ -n "$CSV_NAME" ]; then
            ORIGINAL_INSTRUMENTATION_ARGS=$(kubectl get csv "$CSV_NAME" -n "$NS" -o json \
              | jq -c '[.spec.install.spec.deployments[0].spec.template.spec.containers[0].args[] | select(startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image="))]')
          else
            ORIGINAL_INSTRUMENTATION_ARGS=$(kubectl get deploy "$DEPLOY" -n "$NS" -o json \
              | jq -c '[.spec.template.spec.containers[0].args[] | select(startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image="))]')
          fi
          kubectl create configmap original-instrumentation-args -n "$NAMESPACE" \
            --from-literal=args="$ORIGINAL_INSTRUMENTATION_ARGS"

          # Get the operator's effective default images (env var overrides compiled-in args).
          DEFAULT_DOTNET=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_DOTNET")].value}' 2>/dev/null || true)
          DEFAULT_JAVA=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_JAVA")].value}' 2>/dev/null || true)

          # Fall back to the compiled-in upstream defaults when no env override is present (kind/direct install).
          [ -z "$DEFAULT_DOTNET" ] && DEFAULT_DOTNET="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.15.0"
          [ -z "$DEFAULT_JAVA" ] && DEFAULT_JAVA="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.28.1"

          DOTNET_REPO="${DEFAULT_DOTNET%:*}"
          JAVA_REPO="${DEFAULT_JAVA%:*}"
          DOTNET_DEFAULT_TAG="${DEFAULT_DOTNET##*:}"

          # Choose test images based on whether the default tag is semver-parseable:
          #   Semver default (e.g. 1.15.0): use a version BELOW the blocked threshold so the
          #     range check (current < blocked <= target) fires.
          #   Non-semver default (e.g. "latest"): use the EXACT blocked version so the
          #     exact-match fallback in IsInstrumentationVersionUnupgradable fires.
          if echo "$DOTNET_DEFAULT_TAG" | grep -qE '^v?[0-9]+\.[0-9]+'; then
            BLOCKED_DOTNET_IMG="${DOTNET_REPO}:1.2.0"
            BLOCKED_JAVA_IMG="${JAVA_REPO}:1.33.6"
          else
            BLOCKED_DOTNET_IMG="${DOTNET_REPO}:1.3.0"
            BLOCKED_JAVA_IMG="${JAVA_REPO}:2.0.0"
          fi
          echo "Using blocked images: dotnet=$BLOCKED_DOTNET_IMG  java=$BLOCKED_JAVA_IMG"

          kubectl apply -n "$NAMESPACE" -f - 2>&1 << EOF
          apiVersion: opentelemetry.io/v1alpha1
          kind: Instrumentation
          metadata:
            name: blocked-upgrade-test
          spec:
            exporter:
              endpoint: http://localhost:4317
            sampler:
              type: always_on
            dotnet:
              image: "${BLOCKED_DOTNET_IMG}"
            java:
              image: "${BLOCKED_JAVA_IMG}"
          EOF
        check:
          (contains($stdout, 'cannot be automatically upgraded')): true
    - assert:
        file: 00-assert.yaml
  - name: Patch operator to use old dotnet, java, and nodejs versions as defaults
    try:
    - script:
        timeout: 5m
        shell: /bin/bash
        content: |
          #!/bin/bash
          set -eo pipefail

          NS=opentelemetry-operator-system
          DEPLOY=opentelemetry-operator-controller-manager

          # Get the operator's effective default images
          DEFAULT_DOTNET=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_DOTNET")].value}' 2>/dev/null || true)
          DEFAULT_JAVA=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_JAVA")].value}' 2>/dev/null || true)
          [ -z "$DEFAULT_DOTNET" ] && DEFAULT_DOTNET="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.15.0"
          [ -z "$DEFAULT_JAVA" ] && DEFAULT_JAVA="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.28.1"

          DEFAULT_NODEJS=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_NODEJS")].value}' 2>/dev/null || true)
          [ -z "$DEFAULT_NODEJS" ] && DEFAULT_NODEJS="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0"
          NODEJS_REPO="${DEFAULT_NODEJS%:*}"
          OLD_NODEJS_IMG="${NODEJS_REPO}:0.78.0-6"

          DOTNET_REPO="${DEFAULT_DOTNET%:*}"
          JAVA_REPO="${DEFAULT_JAVA%:*}"
          DOTNET_DEFAULT_TAG="${DEFAULT_DOTNET##*:}"

          # Use the same image selection logic as step 1
          if echo "$DOTNET_DEFAULT_TAG" | grep -qE '^v?[0-9]+\.[0-9]+'; then
            OLD_DOTNET_IMG="${DOTNET_REPO}:1.2.0"
            OLD_JAVA_IMG="${JAVA_REPO}:1.33.6"
          else
            OLD_DOTNET_IMG="${DOTNET_REPO}:1.3.0"
            OLD_JAVA_IMG="${JAVA_REPO}:2.0.0"
          fi
          echo "Using old images: dotnet=$OLD_DOTNET_IMG  java=$OLD_JAVA_IMG"

          # Record the current pod name before patching so we can wait for it to
          # fully terminate later. After kubectl rollout status returns the old pod
          # may still be in Terminating and serving webhook requests with its
          # original (pre-patch) image defaults. We must wait for it to disappear
          # before creating upgrade-test, otherwise the old webhook may stamp the
          # wrong default-image annotations on the new resource.
          OLD_POD=$(kubectl get pods -n "$NS" \
            -l app.kubernetes.io/name=opentelemetry-operator \
            --no-headers 2>/dev/null | awk '{print $1}' | head -1 || true)
          echo "Pod before patch: $OLD_POD"

          # Detect whether OLM is managing the operator by checking for a CSV.
          # On kind (upstream CI): no OLM, no CSV — patch the Deployment directly (persists).
          # On OpenShift (OLM): OLM reconciles Deployment back to CSV template within seconds,
          # so we must patch the CSV instead and wait for OLM to propagate the change.
          CSV_NAME=$(kubectl get csv -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -i opentelemetry | head -1 || true)

          if [ -n "$CSV_NAME" ]; then
            echo "OLM install detected (CSV: $CSV_NAME) — patching CSV"

            ARGS=$(kubectl get csv "$CSV_NAME" -n "$NS" \
              -o jsonpath='{.spec.install.spec.deployments[0].spec.template.spec.containers[0].args}')
            NEW_ARGS=$(echo "$ARGS" | jq -c \
              --arg dotnet "$OLD_DOTNET_IMG" \
              --arg java "$OLD_JAVA_IMG" \
              --arg nodejs "$OLD_NODEJS_IMG" \
              '[.[] | select((startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image=")) | not)] + ["--auto-instrumentation-dotnet-image=" + $dotnet, "--auto-instrumentation-java-image=" + $java, "--auto-instrumentation-nodejs-image=" + $nodejs]')

            kubectl patch csv "$CSV_NAME" -n "$NS" --type=json \
              -p="[{\"op\":\"replace\",\"path\":\"/spec/install/spec/deployments/0/spec/template/spec/containers/0/args\",\"value\":$NEW_ARGS}]"

            # Poll the Deployment spec until OLM propagates the CSV args change.
            echo "Waiting for OLM to propagate args from CSV to operator Deployment..."
            TIMEOUT=120
            ELAPSED=0
            DEP_ARGS=""
            while [ $ELAPSED -lt $TIMEOUT ]; do
              DEP_ARGS=$(kubectl get deploy "$DEPLOY" -n "$NS" \
                -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || true)
              if echo "$DEP_ARGS" | grep -q "auto-instrumentation-dotnet-image"; then
                echo "Override args found in Deployment spec after ${ELAPSED}s"
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if ! echo "$DEP_ARGS" | grep -q "auto-instrumentation-dotnet-image"; then
              echo "ERROR: OLM did not propagate args from CSV to the Deployment within ${TIMEOUT}s"
              exit 1
            fi
          else
            echo "Direct install detected (no CSV) — patching Deployment directly"

            ARGS=$(kubectl get deploy -n "$NS" "$DEPLOY" -o json | jq -c '.spec.template.spec.containers[0].args')
            NEW_ARGS=$(echo "$ARGS" | jq -c \
              --arg dotnet "$OLD_DOTNET_IMG" \
              --arg java "$OLD_JAVA_IMG" \
              --arg nodejs "$OLD_NODEJS_IMG" \
              '[.[] | select((startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image=")) | not)] + ["--auto-instrumentation-dotnet-image=" + $dotnet, "--auto-instrumentation-java-image=" + $java, "--auto-instrumentation-nodejs-image=" + $nodejs]')

            kubectl patch deploy -n "$NS" "$DEPLOY" --type='json' \
              -p="[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/args\",\"value\":$NEW_ARGS}]"
          fi

          kubectl rollout status deploy/$DEPLOY -n "$NS" --timeout=120s

          # Wait for the pre-patch pod to fully terminate. kubectl rollout status
          # returns once the new pod is Ready, but the old pod may still be in the
          # Terminating phase (default 30 s grace period) and serving webhook
          # requests with its original image defaults. Waiting here ensures the
          # next step's Instrumentation creation is handled by the newly-patched
          # webhook, which stamps the correct (old-image) annotations.
          if [ -n "$OLD_POD" ]; then
            echo "Waiting for old pod $OLD_POD to fully terminate..."
            kubectl wait pod -n "$NS" "$OLD_POD" --for=delete --timeout=60s 2>/dev/null || true
          fi
  - name: Create instrumentation that will be subject to upgrade
    try:
    - apply:
        file: 01-install-instrumentation-upgrade-test.yaml
    - assert:
        file: 01-assert.yaml
  - name: Restore dotnet and java defaults and upgrade nodejs to 0.79.0
    try:
    - script:
        timeout: 5m
        shell: /bin/bash
        content: |
          #!/bin/bash
          set -eo pipefail

          NS=opentelemetry-operator-system
          DEPLOY=opentelemetry-operator-controller-manager

          OLD_NODEJS_IMG=$(kubectl get instrumentation upgrade-test -n "$NAMESPACE" -o jsonpath='{.spec.nodejs.image}')
          # The compiled NodeJS default can still be below the blocked release.
          TARGET_NODEJS_IMG="${OLD_NODEJS_IMG%:*}:0.79.0-1"

          CSV_NAME=$(kubectl get csv -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -i opentelemetry | head -1 || true)

          if [ -n "$CSV_NAME" ]; then
            echo "OLM install detected (CSV: $CSV_NAME) — restoring CSV args"

            ARGS=$(kubectl get csv "$CSV_NAME" -n "$NS" \
              -o jsonpath='{.spec.install.spec.deployments[0].spec.template.spec.containers[0].args}')
            NEW_ARGS=$(echo "$ARGS" | jq -c --arg nodejs "$TARGET_NODEJS_IMG" \
              '[.[] | select((startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image=")) | not)] + ["--auto-instrumentation-nodejs-image=" + $nodejs]')

            kubectl patch csv "$CSV_NAME" -n "$NS" --type=json \
              -p="[{\"op\":\"replace\",\"path\":\"/spec/install/spec/deployments/0/spec/template/spec/containers/0/args\",\"value\":$NEW_ARGS}]"

            # Poll until override args are removed from the Deployment spec
            echo "Waiting for OLM to remove override args from Deployment..."
            TIMEOUT=120
            ELAPSED=0
            DEP_ARGS=""
            while [ $ELAPSED -lt $TIMEOUT ]; do
              DEP_ARGS=$(kubectl get deploy "$DEPLOY" -n "$NS" \
                -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || true)
              if ! echo "$DEP_ARGS" | grep -q "auto-instrumentation-dotnet-image"; then
                echo "Override args removed from Deployment spec after ${ELAPSED}s"
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if echo "$DEP_ARGS" | grep -q "auto-instrumentation-dotnet-image"; then
              echo "ERROR: OLM did not remove override args from the Deployment within ${TIMEOUT}s"
              exit 1
            fi
          else
            echo "Direct install detected (no CSV) — restoring Deployment args directly"

            ARGS=$(kubectl get deploy -n "$NS" "$DEPLOY" -o json | jq -c '.spec.template.spec.containers[0].args')
            NEW_ARGS=$(echo "$ARGS" | jq -c --arg nodejs "$TARGET_NODEJS_IMG" \
              '[.[] | select((startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image=")) | not)] + ["--auto-instrumentation-nodejs-image=" + $nodejs]')

            kubectl patch deploy -n "$NS" "$DEPLOY" --type='json' \
              -p="[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/args\",\"value\":$NEW_ARGS}]"
          fi

          kubectl rollout status deploy/$DEPLOY -n "$NS" --timeout=120s
          # Give the upgrade mechanism time to process existing Instrumentation CRs
          sleep 5
  - name: Assert upgrades were blocked
    try:
    # The Instrumentation status should record the blocked upgrade reason for all
    # languages, regardless of which image registry or tag the operator uses.
    - assert:
        file: 02-assert.yaml
    - script:
        shell: /bin/bash
        content: |
          set -eo pipefail
          NODEJS_IMG=$(kubectl get instrumentation upgrade-test -n "$NAMESPACE" -o jsonpath='{.spec.nodejs.image}')
          kubectl patch instrumentation blocked-upgrade-test -n "$NAMESPACE" --type=merge \
            -p="$(jq -nc --arg image "$NODEJS_IMG" '{spec: {nodejs: {image: $image}}}')" 2>&1
        check:
          (contains($stdout, 'nodejs image')): true
          (contains($stdout, 'NodeJS instrumentation 0.79.0')): true
    # Verify all UpgradeBlocked events were emitted by the operator. We do
    # this in a script (instead of separate chainsaw `assert` blocks on the Event
    # resource) because chainsaw's assertion-tree matcher cannot reliably
    # disambiguate Events that share every field except `note` — it picks
    # one actual event and compares it against multiple expected matchers, which
    # fails for at least one of them.
    - script:
        timeout: 90s
        shell: /bin/bash
        content: |
          #!/bin/bash
          set -eo pipefail

          NS=opentelemetry-operator-system
          DEPLOY=opentelemetry-operator-controller-manager

          # Compute the current (restored) operator defaults — the images upgrade-test must NOT have.
          CURRENT_DOTNET=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_DOTNET")].value}' 2>/dev/null || true)
          CURRENT_JAVA=$(kubectl get deploy -n "$NS" "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELATED_IMAGE_AUTO_INSTRUMENTATION_JAVA")].value}' 2>/dev/null || true)
          [ -z "$CURRENT_DOTNET" ] && CURRENT_DOTNET="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.15.0"
          [ -z "$CURRENT_JAVA" ] && CURRENT_JAVA="ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.28.1"

          # Verify the images in upgrade-test were NOT auto-upgraded to the current defaults.
          # This is the core proof that upgrade blocking worked: the images must still be at
          # the old blocked version set in step 2, not at the restored current defaults.
          ACTUAL_DOTNET=$(kubectl get instrumentation upgrade-test -n "$NAMESPACE" \
            -o jsonpath='{.spec.dotnet.image}' 2>/dev/null || true)
          ACTUAL_JAVA=$(kubectl get instrumentation upgrade-test -n "$NAMESPACE" \
            -o jsonpath='{.spec.java.image}' 2>/dev/null || true)

          if [ "$ACTUAL_DOTNET" = "$CURRENT_DOTNET" ]; then
            echo "ERROR: dotnet image was auto-upgraded to current default '$CURRENT_DOTNET' — blocking failed" >&2
            exit 1
          fi
          if [ "$ACTUAL_JAVA" = "$CURRENT_JAVA" ]; then
            echo "ERROR: java image was auto-upgraded to current default '$CURRENT_JAVA' — blocking failed" >&2
            exit 1
          fi
          ACTUAL_NODEJS=$(kubectl get instrumentation upgrade-test -n "$NAMESPACE" \
            -o jsonpath='{.spec.nodejs.image}')
          if [ -z "$ACTUAL_NODEJS" ] || [ "$ACTUAL_NODEJS" != "${ACTUAL_NODEJS%:*}:0.78.0-6" ]; then
            echo "ERROR: nodejs image was not preserved at 0.78.0-6: '$ACTUAL_NODEJS'" >&2
            exit 1
          fi
          echo "Images preserved at blocked version (not auto-upgraded):"
          echo "  dotnet: $ACTUAL_DOTNET"
          echo "  java:   $ACTUAL_JAVA"
          echo "  nodejs: $ACTUAL_NODEJS"

          # Events are queued by the operator's event recorder and flushed
          # asynchronously, so the Instrumentation status may be updated before
          # the events surface in the API. Retry briefly to allow them to land.
          notes=""
          missing=()
          for _ in {1..30}; do
            events_json=$(kubectl get events.events.k8s.io -n "$NAMESPACE" -o json)
            notes=$(jq -r '.items[] | select(.reason == "UpgradeBlocked" and .regarding.name == "upgrade-test") | .note' <<<"$events_json")
            missing=()
            grep -qF "Automated upgrade blocked for dotnet:" <<<"$notes" || missing+=("dotnet")
            grep -qF "Automated upgrade blocked for java:"   <<<"$notes" || missing+=("java")
            grep -qF "Automated upgrade blocked for nodejs:" <<<"$notes" || missing+=("nodejs")
            [ ${#missing[@]} -eq 0 ] && exit 0
            sleep 2
          done
          echo "Missing UpgradeBlocked events for: ${missing[*]}" >&2
          echo "Notes for UpgradeBlocked / upgrade-test events:" >&2
          echo "$notes" >&2
          echo "All events in namespace $NAMESPACE:" >&2
          jq '.items[] | {reason, type, regarding: .regarding.name, note}' <<<"$events_json" >&2
          exit 1
    catch:
    - get:
        apiVersion: opentelemetry.io/v1alpha1
        kind: Instrumentation
        name: upgrade-test
        format: yaml
    - get:
        apiVersion: events.k8s.io/v1
        kind: Event
        format: yaml
    - script:
        content: |
          kubectl logs -n opentelemetry-operator-system \
            -l app.kubernetes.io/name=opentelemetry-operator \
            --container manager --tail=100 || true
    finally:
    - script:
        timeout: 5m
        shell: /bin/bash
        content: |
          set -eo pipefail
          ORIGINAL_INSTRUMENTATION_ARGS=$(kubectl get configmap original-instrumentation-args -n "$NAMESPACE" -o jsonpath='{.data.args}')
          NS=opentelemetry-operator-system
          DEPLOY=opentelemetry-operator-controller-manager
          CSV_NAME=$(kubectl get csv -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -i opentelemetry | head -1 || true)
          if [ -n "$CSV_NAME" ]; then
            ARGS=$(kubectl get csv "$CSV_NAME" -n "$NS" \
              -o jsonpath='{.spec.install.spec.deployments[0].spec.template.spec.containers[0].args}')
            ARGS_PATH=/spec/install/spec/deployments/0/spec/template/spec/containers/0/args
            RESOURCE="csv/$CSV_NAME"
          else
            ARGS=$(kubectl get deploy "$DEPLOY" -n "$NS" -o json | jq -c '.spec.template.spec.containers[0].args')
            ARGS_PATH=/spec/template/spec/containers/0/args
            RESOURCE="deploy/$DEPLOY"
          fi
          NEW_ARGS=$(jq -c --argjson original "$ORIGINAL_INSTRUMENTATION_ARGS" \
            '[.[] | select((startswith("--auto-instrumentation-dotnet-image=") or startswith("--auto-instrumentation-java-image=") or startswith("--auto-instrumentation-nodejs-image=")) | not)] + $original' <<<"$ARGS")
          kubectl patch "$RESOURCE" -n "$NS" --type=json \
            -p="$(jq -nc --arg path "$ARGS_PATH" --argjson args "$NEW_ARGS" '[{op: "replace", path: $path, value: $args}]')"
          kubectl rollout status deploy/$DEPLOY -n "$NS" --timeout=120s
