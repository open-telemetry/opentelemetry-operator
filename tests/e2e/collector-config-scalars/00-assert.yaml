apiVersion: v1
kind: ConfigMap
metadata:
  (starts_with(name, 'config-scalars-collector-')): true
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug: {}
    processors:
      batch:
        send_batch_max_size: 1000000
        send_batch_size: 8192
        timeout: 10s
      metricstransform:
        transforms:
          - action: update
            include: some.metric
            operations:
              - action: add_label
                new_label: cluster
                new_value: "0e12"
      probabilistic_sampler:
        sampling_percentage: 15.5
      resource:
        attributes:
          - action: insert
            key: looks-like-bool
            value: "true"
          - action: insert
            key: looks-like-float
            value: ".inf"
          - action: insert
            key: looks-like-timestamp
            value: "2001-12-14"
          - action: insert
            key: multi-line
            value: |-
              line one
              line two
          - action: insert
            key: tab-led-multi-line
            value: "\tindented\nline two"
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        metrics:
          exporters:
            - debug
          processors:
            - batch
            - metricstransform
            - resource
          receivers:
            - otlp
        traces:
          exporters:
            - debug
          processors:
            - probabilistic_sampler
          receivers:
            - otlp
---
# The API server stores numbers as JSON: an integer spelled 8192.0 in the manifest is
# stored, and read back, as 8192.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: config-scalars
spec:
  config:
    processors:
      batch:
        send_batch_max_size: 1000000
        send_batch_size: 8192
      probabilistic_sampler:
        sampling_percentage: 15.5
---
# The collector accepts the rendered config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-scalars-collector
status:
  readyReplicas: 1
