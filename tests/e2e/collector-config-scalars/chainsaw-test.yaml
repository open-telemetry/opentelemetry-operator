# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: collector-config-scalars
# Verifies that scalar values in spec.config keep their type and spelling on the way from the CR,
# through the API server's JSON representation, to the collector.yaml the operator writes to the
# ConfigMap, and that the collector starts with the result:
#   - strings a YAML parser would read as a number, boolean, special float or timestamp if unquoted
#     ("0e12" from issue #4314, "true", ".inf", "2001-12-14") are quoted;
#   - integers are written as integers, including ones large enough (>= 1e6) that a float64
#     would be printed in exponent notation, and a float stays a float; an integer spelled
#     8192.0 in the manifest is stored by the API server as 8192 and rendered that way;
#   - multi-line strings are written as literal blocks, except one whose first line starts with
#     a tab, which is double-quoted (https://github.com/yaml/go-yaml/issues/383).
# The unit tests in internal/otelconfig cover the full table of cases; this test shows that the
# assumptions they make about the API server's JSON hold on a real cluster.
spec:
  steps:
    - name: install
      try:
        - script:
            content: |
              VERSION=$(kubectl logs deployment/opentelemetry-operator-controller-manager \
                -n opentelemetry-operator-system | \
                grep -o '"collector-image":"[^"]*"' | head -1 | \
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              printf '%s' "${VERSION:-latest}"
            outputs:
              - name: collectorVersion
                value: ($stdout)
        - apply:
            template: true
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
