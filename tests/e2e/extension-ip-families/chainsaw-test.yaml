# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: extension-ip-families
# Verifies that spec.ipFamilies and spec.ipFamilyPolicy are applied to the
# extension Service as well as to the main collector Service. See #5891.
# RequireDualStack is used because it differs from the cluster default
# (SingleStack), so the assertion fails if the fields are not propagated.
# It needs a dual-stack cluster, which the kind-*.yaml configs provide.
spec:
  steps:
    - name: step-00
      description: collector with an extension port and dual-stack IP families
      try:
        - apply:
            file: 00-install.yaml
        - assert:
            file: 00-assert.yaml
