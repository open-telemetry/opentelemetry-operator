apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: collector-with-target-allocator-rbac-comprehensive
spec:
  bindings:
    - name: serviceAccountName
      value: collector
    - name: clusterRoleName
      value: (join('-', ['collector', $namespace]))
    - name: clusterRoleBindingName
      value: (join('-', ['collector', $namespace]))
  try:
    - apply:
        resource:
          apiVersion: v1
          automountServiceAccountToken: true
          kind: ServiceAccount
          metadata:
            name: ($serviceAccountName)
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: ($clusterRoleName)
          rules:
          - apiGroups:
            - ""
            resources:
            - pods
            - nodes
            - nodes/proxy
            - nodes/metrics
            - services
            - endpoints
            - namespaces
            verbs:
            - get
            - watch
            - list
          - apiGroups:
            - networking.k8s.io
            resources:
            - ingresses
            verbs:
            - get
            - watch
            - list
          - nonResourceURLs:
            - /metrics
            - /metrics/cadvisor
            verbs:
            - get
    - apply:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: ($clusterRoleBindingName)
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: ($clusterRoleName)
          subjects:
          - kind: ServiceAccount
            name: collector
            namespace: ($namespace)
